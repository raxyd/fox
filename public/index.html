<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fox.</title>
  <script src="/scram/scramjet.all.js"></script>
  <script src="/baremux/index.js"></script>
  <style>
    :root {
      --bg: #120b07;
      --panel: rgba(28, 17, 11, .72);
      --ink: #fff1e2;
      --mute: #b99d86;
      --a: #ff7a1a;
      --a2: #ffb86b;
      --card: rgba(255, 235, 215, .07);
      --line: rgba(255, 235, 215, .1);
      --r: 28px;
      color-scheme: dark;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:light) {
      :root:not([data-theme="dark"]) {
        --bg: #fff2e3;
        --panel: rgba(255, 250, 244, .78);
        --ink: #2b1608;
        --mute: #8a6b52;
        --card: rgba(90, 40, 0, .06);
        --line: rgba(90, 40, 0, .12);
        color-scheme: light
      }
    }

    :root[data-theme="light"] {
      --bg: #fff2e3;
      --panel: rgba(255, 250, 244, .78);
      --ink: #2b1608;
      --mute: #8a6b52;
      --card: rgba(90, 40, 0, .06);
      --line: rgba(90, 40, 0, .12);
      color-scheme: light
    }

    :root[data-theme="dark"] {
      --bg: #120b07;
      --panel: rgba(28, 17, 11, .72);
      --ink: #fff1e2;
      --mute: #b99d86;
      --card: rgba(255, 235, 215, .07);
      --line: rgba(255, 235, 215, .1);
      color-scheme: dark
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.4 "Inter", "Segoe UI", system-ui, sans-serif;
      overflow: hidden
    }

    button,
    input {
      font: inherit;
      color: inherit
    }

    button {
      background: none;
      border: 0;
      cursor: pointer
    }

    .bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0
    }

    .bg i {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .38;
      animation: d 22s ease-in-out infinite alternate
    }

    .bg i:nth-child(1) {
      width: 46vw;
      height: 46vw;
      left: -8vw;
      top: 20vh;
      background: var(--a)
    }

    .bg i:nth-child(2) {
      width: 36vw;
      height: 36vw;
      right: 4vw;
      top: -10vh;
      background: #c2410c;
      animation-delay: -8s
    }

    .bg i:nth-child(3) {
      width: 30vw;
      height: 30vw;
      right: 20vw;
      bottom: -12vh;
      background: var(--a2);
      opacity: .2;
      animation-delay: -14s
    }

    @keyframes d {
      to {
        transform: translate(6vw, 5vh) scale(1.15)
      }
    }

    @media (prefers-reduced-motion:reduce) {
      .bg i {
        animation: none
      }
    }

    .app {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 72px 1fr;
      height: 100%
    }

    .side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 0
    }

    .side .sp {
      flex: 1
    }

    .ib {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--mute);
      transition: .2s
    }

    .ib:hover {
      background: var(--card);
      color: var(--ink)
    }

    .ib.on {
      background: var(--a);
      color: #1b0b00
    }

    svg.i {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 10px 12px 12px 0
    }

    .tabs {
      display: flex;
      gap: 6px;
      align-items: center;
      height: 40px
    }

    .tabs .t {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px 0 14px;
      height: 36px;
      border-radius: 99px;
      background: var(--card);
      max-width: 180px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid transparent
    }

    .tabs .t.on {
      border-color: var(--a);
      background: var(--panel)
    }

    .tabs .t span {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis
    }

    .tabs .t b {
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-weight: 400;
      color: var(--mute)
    }

    .tabs .t b:hover {
      background: var(--line)
    }

    .tabs .plus {
      margin-left: auto;
      flex: none
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 44px
    }

    .url {
      flex: 1;
      max-width: 680px;
      margin: 0 auto;
      height: 34px;
      border-radius: 99px;
      background: var(--card);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 8px;
      font-size: 13px;
      min-width: 0
    }

    .panel {
      flex: 1;
      min-height: 0;
      border-radius: var(--r);
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(18px);
      overflow: auto;
      position: relative
    }

    .home {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 70px;
      text-align: center
    }

    .logo {
      width: 76px;
      height: 76px;
      margin-bottom: 6px;
      animation: b 4s ease-in-out infinite
    }

    @keyframes b {
      50% {
        transform: translateY(-6px) rotate(-3deg)
      }
    }

    h1 {
      font-size: clamp(54px, 9vw, 104px);
      letter-spacing: -.05em;
      line-height: 1;
      font-weight: 800
    }

    h1 em {
      color: var(--a);
      font-style: normal
    }

    .search {
      margin-top: 26px;
      width: min(520px, 100%);
      height: 54px;
      border-radius: 99px;
      background: var(--card);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      border: 1px solid transparent
    }

    .search:focus-within {
      border-color: var(--a)
    }

    .search input {
      flex: 1;
      background: none;
      border: 0;
      outline: 0;
      min-width: 0
    }

    .bm {
      width: min(520px, 100%);
      margin-top: 28px;
      text-align: left
    }

    .bm h3 {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      gap: 12px;
      align-items: center
    }

    .bm h3 button {
      font-size: 12px;
      color: var(--mute);
      padding: 2px 10px;
      border-radius: 99px;
      background: var(--card)
    }

    .grid6 {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px
    }

    .bk {
      position: relative;
      width: 76px;
      padding: 12px 0 10px;
      border-radius: calc(var(--r) * .7);
      background: var(--card);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      transition: .2s
    }

    .bk:hover {
      transform: translateY(-3px);
      background: var(--line)
    }

    .bk u {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--line);
      display: grid;
      place-items: center;
      text-decoration: none;
      color: var(--a2)
    }

    .bk s {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--a);
      color: #1b0b00;
      font: 700 12px/20px sans-serif;
      text-align: center;
      text-decoration: none
    }

    .foot {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 18px;
      display: flex;
      justify-content: space-between;
      font-size: 13px
    }

    .foot a {
      text-decoration: underline;
      margin-left: 14px;
      cursor: pointer
    }

    .pg {
      padding: 30px clamp(18px, 4vw, 48px) 40px;
      max-width: 980px;
      margin: 0 auto
    }

    .pg h2 {
      font-size: 34px;
      letter-spacing: -.03em;
      margin-bottom: 4px
    }

    .pg .sub {
      color: var(--mute);
      margin-bottom: 22px
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px
    }

    .card {
      border-radius: calc(var(--r) * .8);
      background: var(--card);
      padding: 14px;
      border: 1px solid var(--line)
    }

    .poster {
      aspect-ratio: 2/3;
      border-radius: calc(var(--r) * .6);
      display: flex;
      align-items: flex-end;
      padding: 12px;
      font-weight: 700;
      font-size: 15px;
      color: #fff;
      cursor: pointer;
      transition: .2s;
      text-shadow: 0 1px 8px rgba(0, 0, 0, .4)
    }

    .poster:hover {
      transform: scale(1.04) rotate(-1deg)
    }

    .pill {
      background: var(--a);
      color: #1b0b00;
      border-radius: 99px;
      padding: 10px 20px;
      font-weight: 600
    }

    .pill.g {
      background: var(--card);
      color: var(--ink)
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .hole {
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(0, 0, 0, .35);
      display: grid;
      place-items: center;
      font-size: 44px;
      cursor: pointer;
      overflow: hidden;
      box-shadow: inset 0 -8px 0 rgba(0, 0, 0, .25);
      user-select: none
    }

    .hole span {
      transition: transform .12s;
      transform: translateY(120%)
    }

    .hole.up span {
      transform: none
    }

    .trk {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-radius: calc(var(--r) * .6);
      cursor: pointer
    }

    .trk:hover,
    .trk.on {
      background: var(--card)
    }

    .trk .n {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--a);
      color: #1b0b00;
      display: grid;
      place-items: center
    }

    .bar2 {
      height: 6px;
      border-radius: 9px;
      background: var(--line);
      overflow: hidden;
      margin-top: 6px
    }

    .bar2 div {
      height: 100%;
      width: 0;
      background: var(--a)
    }

    .msgs {
      height: 340px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 6px
    }

    .m {
      max-width: 78%;
      padding: 10px 16px;
      border-radius: calc(var(--r) * .7);
      background: var(--card)
    }

    .m.me {
      align-self: flex-end;
      background: var(--a);
      color: #1b0b00
    }

    .in {
      display: flex;
      gap: 10px;
      margin-top: 12px
    }

    .in input {
      flex: 1;
      height: 46px;
      border-radius: 99px;
      background: var(--card);
      border: 1px solid transparent;
      outline: 0;
      padding: 0 20px
    }

    .in input:focus {
      border-color: var(--a)
    }

    .tg {
      width: 48px;
      height: 28px;
      border-radius: 99px;
      background: var(--line);
      position: relative;
      flex: none;
      transition: .2s
    }

    .tg::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--ink);
      transition: .2s
    }

    .tg.on {
      background: var(--a)
    }

    .tg.on::after {
      left: 23px;
      background: #1b0b00
    }

    .li {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 4px;
      border-bottom: 1px solid var(--line)
    }

    .li div:first-child {
      flex: 1
    }

    .li small {
      color: var(--mute);
      display: block
    }

    .sw {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid transparent
    }

    .sw.on {
      border-color: var(--ink)
    }

    .gl {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 16px
    }

    .gt {
      text-align: left;
      border-radius: calc(var(--r) * .8);
      background: var(--card);
      border: 1px solid var(--line);
      padding: 8px 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: .2s
    }

    .gt:hover {
      transform: translateY(-4px);
      border-color: var(--a)
    }

    .gt span {
      padding: 0 8px;
      font-weight: 600
    }

    .gi {
      aspect-ratio: 4/3;
      border-radius: calc(var(--r) * .6);
      background-size: cover;
      background-position: center;
      display: grid;
      place-items: center;
      font-size: 44px
    }

    input[type=range] {
      accent-color: var(--a);
      width: 200px
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      background: var(--a);
      color: #1b0b00;
      padding: 10px 20px;
      border-radius: 99px;
      font-weight: 600;
      z-index: 9;
      opacity: 0;
      transition: .3s;
      pointer-events: none
    }

    .toast.s {
      opacity: 1
    }

    @media (max-width:720px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr auto
      }

      .side {
        flex-direction: row;
        order: 2;
        overflow-x: auto;
        padding: 6px;
        justify-content: flex-start
      }

      .side .sp {
        display: none
      }

      .main {
        padding: 10px 10px 0
      }

      .ib {
        flex: none
      }

      .foot {
        position: static;
        margin-top: 30px
      }
    }

    #view {
      height: 100%
    }

    .url input {
      flex: 1;
      background: none;
      border: 0;
      outline: 0;
      min-width: 0;
      font-size: 13px
    }

    .pf {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
      border-radius: var(--r);
      display: none
    }

    /* ---------- smoothness ---------- */
    :root {
      --ease: cubic-bezier(.2, .8, .2, 1)
    }

    button,
    .search,
    .url,
    .tabs .t,
    .card,
    .li,
    .bk,
    .gt,
    .poster,
    .trk {
      transition: transform .3s var(--ease), background-color .3s, border-color .3s, color .3s, box-shadow .3s, opacity .3s
    }

    body,
    .panel,
    .tg,
    .tg::after {
      transition: background-color .5s, color .5s, border-color .5s
    }

    button:active {
      transform: scale(.94)
    }

    .ib:hover {
      transform: scale(1.08)
    }

    .search:focus-within {
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--a) 22%, transparent);
      transform: scale(1.02)
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px) scale(.98)
      }
    }

    @keyframes fade {
      from {
        opacity: 0
      }
    }

    .pg {
      animation: rise .5s var(--ease) backwards
    }

    .home>:not(.logo) {
      animation: rise .6s var(--ease) backwards
    }

    .home>:nth-child(2) {
      animation-delay: .05s
    }

    .home>:nth-child(3) {
      animation-delay: .1s
    }

    .home>:nth-child(4) {
      animation-delay: .15s
    }

    .home>:nth-child(5) {
      animation-delay: .2s
    }

    #view .gt,
    #view .bk,
    #view .li,
    #view .card {
      animation: rise .5s var(--ease) backwards;
      animation-delay: calc(var(--i, 0)*40ms)
    }

    .pf {
      animation: fade .4s ease
    }

    /* ---------- mouse-reactive background ---------- */
    .bg i {
      will-change: translate
    }

    .glow {
      position: absolute;
      left: 0;
      top: 0;
      width: 440px;
      height: 440px;
      border-radius: 50%;
      background: radial-gradient(circle, color-mix(in srgb, var(--a) 38%, transparent), transparent 65%);
      opacity: .55;
      pointer-events: none;
      will-change: transform
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition-duration: .01ms !important
      }
    }
  </style>
</head>

<body>
  <div class="bg"><i></i><i></i><i></i></div>
  <div class="app">
    <nav class="side" id="side"></nav>
    <div class="main">
      <div class="tabs" id="tabs"></div>
      <div class="bar">
        <button class="ib" id="back" title="Back"></button><button class="ib" id="fwd" title="Forward"></button><button
          class="ib" id="rl" title="Reload"></button>
        <form class="url" id="uf"><span id="lock"></span><input id="url" autocomplete="off" spellcheck="false"></form>
      </div>
      <div class="panel" id="panel">
        <div id="view"></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const P = {home: '<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>', movies: '<rect x="3" y="5" width="18" height="15" rx="4"/><path d="M3 10h18M8 5l-2 5M14 5l-2 5"/>', games: '<rect x="2" y="7" width="20" height="11" rx="5.5"/><path d="M7 10v5M4.5 12.5h5"/><circle cx="16" cy="11" r="1"/><circle cx="18.5" cy="14" r="1"/>', music: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>', ai: '<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>', chat: '<path d="M21 12a8 8 0 01-11.5 7.2L3 21l1.8-6A8 8 0 1121 12z"/>', extensions: '<path d="M10 4a2 2 0 114 0v2h4v4h-2a2 2 0 100 4h2v6H4v-6h2a2 2 0 100-4H4V6h6z"/>', coins: '<circle cx="12" cy="12" r="9"/><path d="M12 6v12M15 9h-4.5a2 2 0 000 4h3a2 2 0 010 4H9"/>', profile: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M6 19c1.5-3 4-4 6-4s4.5 1 6 4"/>', settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>', docs: '<path d="M3 5c3-1 6-1 9 1 3-2 6-2 9-1v14c-3-1-6-1-9 1-3-2-6-2-9-1z"/><path d="M12 6v14"/>', back: '<path d="M19 12H5M11 6l-6 6 6 6"/>', fwd: '<path d="M5 12h14M13 6l6 6-6 6"/>', rl: '<path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>', plus: '<path d="M12 5v14M5 12h14"/>', search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>', lock: '<rect x="5" y="11" width="14" height="9" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/>', play: '<path d="M7 4l13 8-13 8z"/>', stop: '<rect x="6" y="6" width="12" height="12" rx="2"/>'};
    const ic = n => `<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;
    const FOX = ``;
    const NAV = ['home', 'movies', 'games'], BOT = ['profile', 'settings', 'docs'];
    const $ = s => document.querySelector(s);
    const ENGINE = 'https://www.duckduckgo.com/search?q=%s', MOVIES = 'https://aether.bar', GC = ['#ff7a1a,#7c2d12', '#f59e0b,#78350f', '#ef4444,#450a0a', '#38bdf8,#0c4a6e', '#10b981,#064e3b', '#a855f7,#3b0764'];
    let tabs = [{id: 1, v: 'home'}], act = 1, nid = 2, bms = ['games', 'movies'], edit = false, GAMES = [];
    const toast = t => {const e = $('#toast'); e.textContent = t; e.classList.add('s'); setTimeout(() => e.classList.remove('s'), 2200)};
    /* ---------- Ad blocker (enforced in sw.js; this just stores and syncs the switch) ---------- */
    let AB = localStorage.getItem('fox.adblock') !== '0';
    async function syncAdblock() {
      try {
        const c = await caches.open('fox-settings');
        await c.put('/__fox/adblock', new Response(AB ? '1' : '0'));
        const reg = await navigator.serviceWorker.getRegistration();
        reg?.active?.postMessage({type: 'adblock', on: AB});
      } catch (e) {console.warn('adblock sync failed', e)}
    }
    $('#back').innerHTML = ic('back'); $('#fwd').innerHTML = ic('fwd'); $('#rl').innerHTML = ic('rl'); $('#lock').innerHTML = ic('lock').replace('class="i"', 'class="i" style="width:14px;height:14px"');
    const cur = () => tabs.find(t => t.id == act);
    const newTab = () => {const t = {id: nid++, v: 'home'}; tabs.push(t); act = t.id; return t};
    const mini = n => ic(n).replace('class="i"', 'class="i" style="width:15px;height:15px"');
    /* ---------- Scramjet ---------- */
    function search(input) {try {return new URL(input).toString()} catch { } try {const u = new URL('http://' + input); if (u.hostname.includes('.')) return u.toString()} catch { } return ENGINE.replace('%s', encodeURIComponent(input))}
    let sj, ready;
    function boot() {
      return ready || (ready = (async () => {
        if (!navigator.serviceWorker) throw new Error('Service workers need https or localhost.');
        await navigator.serviceWorker.register('./sw.js'); await syncAdblock();
        const {ScramjetController} = $scramjetLoadController();
        sj = new ScramjetController({files: {wasm: '/scram/scramjet.wasm.wasm', all: '/scram/scramjet.all.js', sync: '/scram/scramjet.sync.js'}});
        await sj.init();
        const conn = new BareMux.BareMuxConnection('/baremux/worker.js');
        const wisp = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/wisp/';
        if ((await conn.getTransport()) !== '/libcurl/index.mjs') await conn.setTransport('/libcurl/index.mjs', [{websocket: wisp}]);
      })().catch(e => {ready = null; throw e}))
    }
    async function nav(url, t = cur()) {
      try {await boot()} catch (e) {console.error(e); toast(e.message || 'proxy failed to start'); return }
      if (!t.frame) {t.frame = sj.createFrame(); t.frame.frame.className = 'pf'; $('#panel').appendChild(t.frame.frame)}
      t.v = 'web'; t.url = url; try {t.frame.go(url)} catch (e) {console.error(e); toast('couldn’t open that link')} render()
    }
    /* ---------- UI ---------- */
    const title = t => t.v == 'web' ? (t.tag || (() => {try {return new URL(t.url).hostname} catch {return 'page'} })()) : t.v == 'home' ? 'New Tab' : t.v;
    function side() {const c = cur(), on = n => n == 'movies' ? c.tag == 'movies' : c.v == n; $('#side').innerHTML = NAV.map(n => `<button class="ib ${on(n) ? 'on' : ''}" data-v="${n}" title="${n}">${ic(n)}</button>`).join('') + '<div class="sp"></div>' + BOT.map(n => `<button class="ib ${on(n) ? 'on' : ''}" data-v="${n}" title="${n}">${ic(n)}</button>`).join('')}
    function open(v) {
      if (v == 'movies') {let t = tabs.find(x => x.tag == 'movies'); if (!t) {t = newTab(); t.tag = 'movies'} act = t.id; render(); if (!t.frame) nav(MOVIES, t); return }
      const t = tabs.find(x => !x.frame && x.v == v) || (cur().frame ? newTab() : cur()); t.v = v; act = t.id; render()
    }
    function render() {
      const t = cur(), web = t.v == 'web';
      $('#tabs').innerHTML = tabs.map(x => `<div class="t ${x.id == act ? 'on' : ''}" data-t="${x.id}">${mini(x.v == 'web' ? (x.tag ? 'movies' : 'search') : x.v == 'home' ? 'home' : x.v)}<span></span><b data-x="${x.id}">${mini('x')}</b></div>`).join('') + `<button class="ib plus" id="np" title="New tab">${ic('plus')}</button>`;
      $('#tabs').querySelectorAll('.t span').forEach((s, i) => s.textContent = title(tabs[i]));
      $('#url').value = web ? t.url : 'fox://' + t.v; side();
      document.querySelectorAll('.pf').forEach(f => f.style.display = 'none');
      const v = $('#view'); v.style.display = web ? 'none' : '';
      if (web) {t.frame.frame.style.display = 'block'; return }
      v.onclick = null; $('#panel').scrollTop = 0; (V[t.v] || V.home)(v)
    }
    const V = {};
    V.home = p => {
      p.innerHTML = `<div class="home"><div class="logo">${FOX}</div><h1>Fox<em>.</em></h1>
<form class="search" id="sf">${ic('search')}<input id="q" placeholder="search at will." autocomplete="off"></form>
<div class="bm"><h3>bookmarks <button id="ed">${edit ? 'done' : 'edit'}</button></h3><div class="grid6">${bms.map(b => `<button class="bk" data-b="${b}"><u>${ic(b)}</u>${b}${edit ? `<s data-rm="${b}">×</s>` : ''}</button>`).join('')}</div></div>
<div class="foot"><span>community</span><span><a data-v="docs">terms</a><a data-v="docs">privacy</a></span></div></div>`;
      $('#sf').onsubmit = e => {e.preventDefault(); const q = $('#q').value.trim(); if (q) nav(search(q))}
    };
    const pg = (t, s, b) => `<div class="pg"><h2>${t}</h2><div class="sub">${s}</div>${b}</div>`;
    V.games = async p => {
      p.innerHTML = pg('games', 'loading…', '');
      if (!GAMES.length) {try {{const j = await (await fetch('games.json')).json(); GAMES = (Array.isArray(j) ? j : j.games || []).map(g => ({name: g.name || g.title || 'Game', image: g.image || g.img || g.thumbnail || g.icon || '', url: g.url || g.link || g.href || ''}))} } catch (e) {if (cur().v == 'games') p.innerHTML = pg('games', 'couldn’t load games.json', ''); return } }
      if (cur().v != 'games') return;
      p.innerHTML = pg('games', 'pick a game', `<div class="gl">${GAMES.map((g, i) => `<button class="gt" data-g="${i}"><div class="gi"></div><span></span></button>`).join('')}</div>`);
      p.querySelectorAll('.gt').forEach((b, i) => {
        const g = GAMES[i], gi = b.querySelector('.gi'); b.querySelector('span').textContent = g.name; gi.style.background = `linear-gradient(160deg,${GC[i % 6]})`; gi.textContent = '🦊';
        if (g.image) {const im = new Image(); im.onload = () => {gi.textContent = ''; gi.style.background = `url("${g.image}") center/cover`}; im.src = g.image}
      });
      p.onclick = e => {const b = e.target.closest('[data-g]'); if (b) {const g = GAMES[b.dataset.g]; if (!g.url) {toast('no link set for ' + g.name); return } let u; try {u = new URL(g.url, location.href).toString()} catch {toast('bad link for ' + g.name); return } const t = cur(); t.tag = null; nav(u, t)} }
    };
    let nm = 'Fenn';
    V.profile = p => {
      p.innerHTML = pg('profile', 'your den card', `<div class="card row" style="gap:20px"><div style="width:84px">${FOX}</div><div><div style="font-size:24px;font-weight:700" id="pn"></div><div style="color:var(--mute)">member of the pack · red fox</div></div></div><div class="in"><input id="nn" placeholder="change name"><button class="pill" id="ns">save</button></div>`);
      $('#pn').textContent = nm; $('#ns').onclick = () => {const v = $('#nn').value.trim(); if (v) {nm = v; $('#pn').textContent = v; toast('saved')} }
    };
    const AC = [['#ff7a1a', '#ffb86b'], ['#ef4444', '#fca5a5'], ['#38bdf8', '#bae6fd'], ['#f5c26b', '#fde9c4']];
    V.settings = p => {
      p.innerHTML = pg('settings', 'make it yours', `<div class="li"><div><b>fur color</b><small>accent</small></div><div class="row">${AC.map((a, i) => `<button class="sw ${i ? '' : 'on'}" data-a="${i}" style="background:${a[0]}"></button>`).join('')}</div></div><div class="li"><div><b>roundness</b><small>corner size</small></div><input type="range" id="rr" min="8" max="48" value="${parseInt(getComputedStyle(document.documentElement).getPropertyValue('--r')) || 28}"></div><div class="li"><div><b>theme</b><small>day or night</small></div><div class="row"><button class="pill g" data-th="light">day</button><button class="pill g" data-th="dark">night</button></div></div><div class="li"><div><b>ad blocker</b><small>blocks known ad and tracker domains · reload pages to apply</small></div><button class="tg ${AB ? 'on' : ''}" data-ab title="ad blocker"></button></div>`);
      p.onclick = e => {const a = e.target.closest('[data-a]'), t = e.target.closest('[data-th]'), R = document.documentElement; const ab = e.target.closest('[data-ab]'); if (ab) {AB = !AB; localStorage.setItem('fox.adblock', AB ? '1' : '0'); ab.classList.toggle('on', AB); syncAdblock(); toast('ad blocker ' + (AB ? 'on' : 'off'))} if (a) {R.style.setProperty('--a', AC[a.dataset.a][0]); R.style.setProperty('--a2', AC[a.dataset.a][1]); p.querySelectorAll('.sw').forEach(s => s.classList.toggle('on', s == a))} if (t) R.dataset.theme = t.dataset.th};
      $('#rr').oninput = e => document.documentElement.style.setProperty('--r', e.target.value + 'px')
    };
    const FF = ['A fox’s whiskers help it sense its way in the dark.', 'Foxes use Earth’s magnetic field to aim their pounce, mostly northeast.', 'A group of foxes is called a skulk or a leash.', 'Fennec foxes have the biggest ears of any fox to stay cool.', 'Arctic foxes change coat color with the seasons.'];
    V.docs = p => {p.innerHTML = pg('docs', 'fox facts, terms & privacy', FF.map(f => `<div class="li"><div>${f}</div></div>`).join('') + `<div class="li"><div><b>terms</b><small>be kind, share snacks.</small></div></div><div class="li"><div><b>privacy</b><small>searches and sites load through this Fox backend.</small></div></div>`)};
    document.addEventListener('click', e => {
      const v = e.target.closest('[data-v]'); if (v && v.closest('#side,.foot')) {open(v.dataset.v); return }
      const rm = e.target.closest('[data-rm]'); if (rm) {bms = bms.filter(b => b != rm.dataset.rm); render(); return }
      const b = e.target.closest('[data-b]'); if (b && !edit) {open(b.dataset.b); return }
      if (e.target.closest('#ed')) {edit = !edit; render(); return }
      const x = e.target.closest('[data-x]'); if (x) {const id = +x.dataset.x, t = tabs.find(q => q.id == id); t.frame?.frame.remove(); tabs = tabs.filter(q => q.id != id); if (!tabs.length) tabs = [{id: nid++, v: 'home'}]; if (!tabs.find(q => q.id == act)) act = tabs[tabs.length - 1].id; render(); return }
      const t = e.target.closest('[data-t]'); if (t) {act = +t.dataset.t; render(); return }
      if (e.target.closest('#np')) {newTab(); render(); return }
      const c = cur();
      if (e.target.closest('#rl')) c.frame ? c.frame.reload?.() : render();
      if (e.target.closest('#back')) {c.frame ? c.frame.back?.() : (c.v = 'home', render())}
      if (e.target.closest('#fwd') && c.frame) c.frame.forward?.()
    });
    $('#uf').onsubmit = e => {e.preventDefault(); const q = $('#url').value.trim(); if (!q || q.startsWith('fox://')) return; const t = cur(); t.tag = null; nav(search(q), t)};
    render();

    /* staggered entrance for cards, bookmarks, list rows */
    new MutationObserver(() => {
      document.querySelectorAll('#view .gt,#view .bk,#view .li,#view .card')
        .forEach((el, i) => {if (!el.style.getPropertyValue('--i')) el.style.setProperty('--i', i)})
    }).observe($('#view'), {childList: true, subtree: true});

    /* background reacts to the mouse (or touch) */
    (() => {
      const bg = document.querySelector('.bg'), orbs = [...bg.children];
      const glow = document.createElement('div'); glow.className = 'glow'; bg.appendChild(glow);
      if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
      const depth = [80, -110, 140];
      let tx = 0, ty = 0, x = 0, y = 0;
      let tgx = innerWidth / 2, tgy = innerHeight / 2, gx = tgx, gy = tgy;
      addEventListener('pointermove', e => {
        tgx = e.clientX; tgy = e.clientY;
        tx = e.clientX / innerWidth - .5; ty = e.clientY / innerHeight - .5;
      }, {passive: true});
      (function loop() {
        x += (tx - x) * .06; y += (ty - y) * .06;      /* orbs drift slowly */
        gx += (tgx - gx) * .12; gy += (tgy - gy) * .12; /* glow follows closer */
        orbs.forEach((o, i) => o.style.translate = `${x * depth[i]}px ${y * depth[i]}px`);
        glow.style.transform = `translate(${gx - 220}px,${gy - 220}px)`;
        requestAnimationFrame(loop);
      })();
    })();
  </script>
</body>

</html>
